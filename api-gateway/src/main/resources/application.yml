server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      discovery:
        locator:
          enabled: false
      routes:
        - id: guest-service
          uri: lb://guest-service
          predicates:
            - Path=/api/guests/**
        - id: room-service
          uri: lb://room-service
          predicates:
            - Path=/api/rooms/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: auth-service-api
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<seg>.*), /auth/$\{seg}
        - id: reservation-service
          uri: lb://reservation-service
          predicates:
            - Path=/api/reservations/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        # Route Swagger docs of each service through the gateway
        - id: guest-service-docs
          uri: lb://guest-service
          predicates:
            - Path=/guest-service/v3/api-docs
          filters:
            - RewritePath=/guest-service/v3/api-docs, /v3/api-docs
        - id: room-service-docs
          uri: lb://room-service
          predicates:
            - Path=/room-service/v3/api-docs
          filters:
            - RewritePath=/room-service/v3/api-docs, /v3/api-docs
        - id: reservation-service-docs
          uri: lb://reservation-service
          predicates:
            - Path=/reservation-service/v3/api-docs
          filters:
            - RewritePath=/reservation-service/v3/api-docs, /v3/api-docs
        - id: payment-service-docs
          uri: lb://payment-service
          predicates:
            - Path=/payment-service/v3/api-docs
          filters:
            - RewritePath=/payment-service/v3/api-docs, /v3/api-docs
        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/auth-service/v3/api-docs
          filters:
            - RewritePath=/auth-service/v3/api-docs, /v3/api-docs
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Swagger UI aggregation: dropdown to reach each service's docs via the gateway
springdoc:
  swagger-ui:
    urls:
      - name: guest-service
        url: /guest-service/v3/api-docs
      - name: room-service
        url: /room-service/v3/api-docs
      - name: reservation-service
        url: /reservation-service/v3/api-docs
      - name: payment-service
        url: /payment-service/v3/api-docs
      - name: auth-service
        url: /auth-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus
security:
  jwt:
    secret: ${JWT_SECRET:change-me-super-secret-hotel-jwt-signing-key-256bits!!}
