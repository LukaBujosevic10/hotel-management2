# ============================================================
# Global configuration served by Config Server to ALL services
# (file name 'application.yml' = shared defaults for every app)
# ============================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
hotel:
  brand-name: "Grand Lepenica Hotel"
  default-check-in-time: "14:00"
  default-check-out-time: "11:00"
  currency: "EUR"
security:
  jwt:
    secret: ${JWT_SECRET:change-me-super-secret-hotel-jwt-signing-key-256bits!!}
server:
  forward-headers-strategy: framework