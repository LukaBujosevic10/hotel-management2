<app-header [username]="auth.username()" [role]="auth.roleLabel()" (logout)="logout()"></app-header>

<mat-sidenav-container class="shell-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/home" routerLinkActive="active">
        <mat-icon matListItemIcon>dashboard</mat-icon> Dashboard
      </a>
      <a mat-list-item routerLink="/rooms" routerLinkActive="active">
        <mat-icon matListItemIcon>meeting_room</mat-icon> Rooms
      </a>
      <a mat-list-item routerLink="/guests" routerLinkActive="active">
        <mat-icon matListItemIcon>people</mat-icon> Guests
      </a>
      <a mat-list-item routerLink="/reservations" routerLinkActive="active">
        <mat-icon matListItemIcon>event_available</mat-icon> Reservations
      </a>
      <a mat-list-item routerLink="/payments" routerLinkActive="active">
        <mat-icon matListItemIcon>payments</mat-icon> Payments
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
